<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Confirmed — Dodo {anty}</title>
  <link rel="icon" href="https://raw.githubusercontent.com/shamim798/dodo-verify/main/logo.png" type="image/png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #0d0f12;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .verify-card {
      background: #181a1f;
      border: 1px solid #282a32;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
    }
    .brand-header {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      background: #a855f7;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 900;
      font-size: 19px;
    }
    .brand-name {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.4px;
    }
    .brand-name span {
      font-weight: 400;
      color: #a855f7;
    }
    .status-badge {
      width: 76px;
      height: 76px;
      background: #d9f99d;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px auto;
      box-shadow: 0 0 30px rgba(217, 249, 157, 0.35);
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .status-badge svg {
      width: 40px;
      height: 40px;
      stroke: #14532d;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    @keyframes popIn {
      0% { transform: scale(0.6); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }
    p {
      font-size: 15px;
      color: #9ca3af;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .email-highlight {
      display: inline-block;
      background: #23262f;
      color: #e5e7eb;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 28px;
      border: 1px solid #323642;
      word-break: break-all;
    }
    .btn-action {
      display: block;
      width: 100%;
      background: #b044f5;
      color: #ffffff;
      text-decoration: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      box-shadow: 0 4px 20px rgba(176, 68, 245, 0.4);
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      background: #9d30e4;
      transform: translateY(-1px);
    }
    .footer-tip {
      font-size: 13px;
      color: #6b7280;
      margin-top: 24px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="verify-card">
    <!-- Brand Header -->
    <div class="brand-header">
      <div class="brand-icon">D</div>
      <div class="brand-name">Dodo<span>{anty}</span></div>
    </div>

    <!-- Verified Lime Badge -->
    <div class="status-badge">
      <svg viewBox="0 0 24 24">
        <path d="M20 6L9 17l-5-5"></path>
      </svg>
    </div>

    <h1>Email Verified! 🎉</h1>
    <p>Your email address has been successfully verified. Your account is now fully active.</p>

    <div class="email-highlight" id="user-email">Account Activated</div>

    <button class="btn-action" onclick="openApp()">Return to Dodo {anty}</button>

    <div class="footer-tip">
      You can now close this tab and return to the <strong>Dodo {anty}</strong> application on your computer to sign in.
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email');
    if (email) {
      document.getElementById('user-email').innerText = email;
    }
    function openApp() {
      window.location.href = 'dodo-anty://verified';
      setTimeout(() => {
        alert('You can now return to the Dodo {anty} desktop application to sign in!');
      }, 500);
    }
  </script>
</body>
</html>
